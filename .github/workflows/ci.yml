name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  server:
    name: Render — tests & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test -- --no-coverage --forceExit

      - name: Build (tsc)
        run: npm run build

      # Triggers a Render deploy when this job passes on a push to main.
      # Add the hook URL in: GitHub repo → Settings → Secrets → RENDER_DEPLOY_HOOK_URL
      # Get the URL from: Render dashboard → your service → Settings → Deploy Hooks
      - name: Trigger Render deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.RENDER_DEPLOY_HOOK_URL != ''
        run: curl -s -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

  client:
    name: Vercel — typecheck & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (tsc + vite)
        run: npm run build
        env:
          VITE_API_URL: http://localhost:3001/api
